name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Validate tag and release inputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -f "docs/releases/v${version}.md"
          python -m py_compile tools/accept.py
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib
          manifest = tomllib.loads(Path('runtime-composition.windows.toml').read_text())
          lock = json.loads(Path('runtime.windows.lock.json').read_text())
          evidence = json.loads(Path('evidence/v0.1.0-windows.json').read_text())
          assert lock['manifest']['composition'] == manifest['composition']
          assert lock['manifest']['providers'] == manifest['providers']
          assert {x['artifact']: x['source'] for x in lock['manifest']['artifacts']} == {x['artifact']: x['source'] for x in manifest['artifacts']}
          assert {tuple(sorted(x.items())) for x in lock['manifest']['requirements']} == {tuple(sorted(x.items())) for x in manifest['requirements']}
          assert lock['runtime_digest'] == evidence['runtime_digest']
          assert evidence['status'] == 'passed'
          assert len(manifest['artifacts']) == 7
          for item in manifest['artifacts']:
              assert item['source'].startswith('oci://') and '@sha256:' in item['source']
          PY
      - name: Assemble source release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir dist-release
          git archive --format=tar.gz --prefix="usd-geospatial-runtime-${version}/" \
            -o "dist-release/usd-geospatial-runtime-${version}-src.tar.gz" "${GITHUB_REF_NAME}"
          cp LICENSE runtime-composition.windows.toml runtime.windows.lock.json \
            evidence/v0.1.0-windows.json dist-release/
          cp "docs/releases/v${version}.md" dist-release/RELEASE_NOTES.md
          cd dist-release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --json isDraft > existing.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing.json)" = true ]; then
              gh release delete "${GITHUB_REF_NAME}" --yes
            else
              echo "release ${GITHUB_REF_NAME} is already published" >&2
              exit 1
            fi
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" \
            --notes-file dist-release/RELEASE_NOTES.md dist-release/*
