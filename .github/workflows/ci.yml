name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Compile the repository tools
        shell: bash
        run: python -m compileall -q tools tests/tooling
      - name: Validate composition, metadata, and release evidence
        shell: bash
        run: python tools/validate_metadata.py
      - name: Test the metadata and acceptance tooling
        shell: bash
        run: python tests/tooling/test_metadata_tools.py
